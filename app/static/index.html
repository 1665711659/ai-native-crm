<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI原生CRM · 管理台</title>
<style>
  :root{
    --primary:#4f6ef7; --primary-dark:#3a52c8; --bg:#f4f6fb; --card:#ffffff;
    --text:#1f2430; --text-dim:#7a8194; --border:#e5e8f0; --ok:#22a06b;
    --warn:#e6a23c; --danger:#e34d59; --radius:10px; --shadow:0 2px 8px rgba(30,40,80,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,#4f6ef7,#7a5af5);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:18px;font-weight:600}
  header .meta{font-size:12px;opacity:.9;display:flex;gap:12px;flex-wrap:wrap}
  header .meta span{background:rgba(255,255,255,.15);padding:2px 10px;border-radius:20px}
  .layout{display:grid;grid-template-columns:280px 1fr 1fr;grid-template-rows:calc(100vh - 52px);gap:14px;padding:14px;height:calc(100vh - 52px)}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .panel-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .panel-h h2{font-size:14px;font-weight:600}
  .panel-h .hint{font-size:11px;color:var(--text-dim)}
  .panel-body{flex:1;overflow-y:auto;padding:12px 16px}
  .panel-foot{padding:10px 14px;border-top:1px solid var(--border)}

  /* ---- 统计卡 ---- */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .stat{background:linear-gradient(135deg,#f7f9ff,#eef2ff);border-radius:8px;padding:10px 12px}
  .stat .num{font-size:20px;font-weight:700;color:var(--primary)}
  .stat .label{font-size:11px;color:var(--text-dim);margin-top:2px}
  .funnel{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .funnel-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .funnel-row .tag{width:52px;color:var(--text-dim)}
  .funnel-row .bar{height:14px;border-radius:4px;background:linear-gradient(90deg,#4f6ef7,#7a5af5);min-width:4px;transition:width .4s}
  .funnel-row .val{width:30px;text-align:right;color:var(--text-dim)}

  /* ---- 客户列表 ---- */
  .search-box{display:flex;gap:6px}
  .search-box input{flex:1;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;outline:none}
  .search-box input:focus{border-color:var(--primary)}
  .customer-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .customer-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
  .customer-item.active{border-color:var(--primary);background:#f5f7ff}
  .customer-item .top{display:flex;justify-content:space-between;align-items:center}
  .customer-item .name{font-weight:600;font-size:13px}
  .badge{font-size:10px;padding:2px 8px;border-radius:12px;color:#fff}
  .b-lead{background:#8a91a5}.b-prospect{background:#4f9cf7}.b-negotiating{background:var(--warn)}.b-won{background:var(--ok)}.b-lost{background:var(--danger)}
  .customer-item .company{font-size:12px;color:var(--text-dim);margin-top:4px}
  .customer-item .foot{font-size:11px;color:var(--text-dim);margin-top:4px;display:flex;justify-content:space-between}

  .btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer}
  .btn:hover{background:var(--primary-dark)}
  .btn.ghost{background:#eef0f7;color:var(--text)}
  .btn.ghost:hover{background:#e0e4f0}
  .btn.sm{padding:3px 10px;font-size:11px}

  select,input[type=text],input[type=number]{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;outline:none}
  input:focus,select:focus{border-color:var(--primary)}

  /* ---- 详情 ---- */
  .kv{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:12px;margin-bottom:10px}
  .kv .k{color:var(--text-dim)}
  .follow-item{border-left:3px solid var(--primary);background:#f8f9ff;padding:8px 10px;border-radius:0 6px 6px 0;margin-bottom:8px;font-size:12px}
  .follow-item .time{color:var(--text-dim);font-size:11px;margin-top:4px}
  .empty{color:var(--text-dim);font-size:12px;text-align:center;padding:24px 0}
  .inline-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
  .inline-form input,.inline-form select{font-size:12px}
  .workflow-tag{display:inline-block;background:#eef7f0;color:var(--ok);font-size:10px;padding:2px 8px;border-radius:10px;margin-top:6px}

  /* ---- Agent / RAG ---- */
  .chat-log{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:2px}
  .msg.bot{align-self:flex-start;background:#f1f3fa;border-bottom-left-radius:2px}
  .steps{background:#f6f8ff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;font-family:Consolas,monospace;color:#4a5372;margin-top:6px}
  .steps .step{padding:3px 0;border-bottom:1px dashed var(--border)}
  .steps .step:last-child{border-bottom:none}
  .srcs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .srcs .src{font-size:10px;background:#eef2ff;color:var(--primary);padding:2px 8px;border-radius:10px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .quick button{background:#eef0f7;border:none;border-radius:14px;padding:4px 12px;font-size:11px;cursor:pointer;color:#444}
  .quick button:hover{background:#dfe4f5}
  .input-row{display:flex;gap:8px}
  .input-row input{flex:1;padding:8px 12px;font-size:13px}
  .right-col{display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .right-col .panel{flex:1;min-height:0}
  .tabs{display:flex;gap:4px}
  .tabs button{border:none;background:transparent;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text-dim);border-radius:6px}
  .tabs button.on{background:#eef2ff;color:var(--primary);font-weight:600}
  .loading{color:var(--text-dim);font-size:12px;font-style:italic}
  @media(max-width:1200px){.layout{grid-template-columns:1fr;grid-template-rows:auto}}
</style>
</head>
<body>
<header>
  <h1>AI 原生 CRM</h1>
  <div class="meta" id="health-meta"><span>加载中...</span></div>
</header>

<div class="layout">
  <!-- 左：统计 + 客户列表 -->
  <div class="panel">
    <div class="panel-h">
      <h2>客户</h2>
      <div class="search-box">
        <input id="search-input" type="text" placeholder="搜索客户/公司..." onkeydown="if(event.key==='Enter')loadCustomers()">
        <button class="btn sm" onclick="loadCustomers()">搜</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="stats" id="stats"></div>
      <div class="funnel" id="funnel"></div>
      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0">
      <div class="inline-form" style="margin:0 0 10px">
        <input id="new-name" type="text" placeholder="姓名" style="width:70px">
        <input id="new-company" type="text" placeholder="公司" style="flex:1;min-width:90px">
        <input id="new-value" type="number" placeholder="金额" style="width:80px">
        <button class="btn sm" onclick="createCustomer()">+ 新建</button>
      </div>
      <div id="customer-list"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <!-- 中：客户详情 -->
  <div class="panel">
    <div class="panel-h"><h2 id="detail-title">客户详情</h2><span class="hint">点左侧客户查看</span></div>
    <div class="panel-body" id="detail-body"><div class="empty">未选择客户</div></div>
  </div>

  <!-- 右：Agent 对话 + RAG -->
  <div class="right-col">
    <div class="panel">
      <div class="panel-h">
        <h2>AI 销售助理</h2>
        <div class="tabs">
          <button id="tab-agent" class="on" onclick="switchTab('agent')">Agent 对话</button>
          <button id="tab-rag" onclick="switchTab('rag')">知识库问答</button>
          <button id="tab-aigc" onclick="switchTab('aigc')">AIGC 文生图</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="quick" id="quick-agent">
          <button onclick="quickAsk(this)">帮我查一下传媒</button>
          <button onclick="quickAsk(this)">现在的销售业绩怎么样</button>
          <button onclick="quickAsk(this)">帮客户4记录一下跟进：电话回访确认预算</button>
        </div>
        <div class="quick" id="quick-rag" style="display:none">
          <button onclick="quickAskRag(this)">客户说太贵了怎么应对</button>
          <button onclick="quickAskRag(this)">标准跟进流程SOP是什么</button>
          <button onclick="quickAskRag(this)">数据安全如何保障</button>
        </div>
        <div class="chat-log" id="chat-log"></div>

        <!-- AIGC 文生图面板 -->
        <div id="aigc-panel" style="display:none">
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px" id="aigc-status">ComfyUI 状态检测中...</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input id="aigc-prompt" type="text" placeholder="提示词，如：现代科技风CRM产品宣传海报，蓝色主题">
            <input id="aigc-negative" type="text" placeholder="负面提示词（可空）">
            <div style="display:flex;gap:8px;align-items:center">
              <select id="aigc-size">
                <option value="512x512">512×512（SD1.5）</option>
                <option value="512x768">512×768 竖版</option>
                <option value="768x512">768×512 横版</option>
                <option value="1024x1024">1024×1024（SDXL）</option>
              </select>
              <button class="btn" id="aigc-btn" onclick="generateImage()">生成图片</button>
            </div>
          </div>
          <div id="aigc-results" style="margin-top:12px"></div>
        </div>
      </div>
      <div class="panel-foot" id="chat-foot">
        <div class="input-row">
          <input id="chat-input" type="text" placeholder="输入消息，回车发送..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="btn" onclick="sendChat()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let mode = 'agent';
let currentCustomer = null;
const STATUS_MAP = {lead:'线索',prospect:'意向',negotiating:'谈判中',won:'已成交',lost:'已流失'};

async function api(path, opts={}){
  const r = await fetch(API + path, opts);
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.msg || '请求失败');
  return j.data;
}
const post = (path, body) => api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
const patch = (path, body) => api(path, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 健康/统计 ---------- */
async function loadHealth(){
  const d = await api('/api/health');
  document.getElementById('health-meta').innerHTML =
    `<span>DB: ${d.db_backend}</span><span>LLM: ${d.llm_mode}</span><span>Embedding: ${d.embedding_mode}</span><span>客户 ${d.customers}</span><span>知识库 ${d.kb_documents} 篇</span>`;
}
async function loadStats(){
  const d = await api('/api/stats');
  const bs = d.by_status || [];
  const countOf = s => (bs.find(x=>x.status===s)?.count) || 0;
  const won = bs.find(x=>x.status==='won');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${d.total_customers||0}</div><div class="label">客户总数</div></div>
    <div class="stat"><div class="num">¥${(d.total_value||0).toLocaleString()}</div><div class="label">总金额</div></div>
    <div class="stat"><div class="num">${won?won.count:0}</div><div class="label">已成交</div></div>
    <div class="stat"><div class="num">¥${won?(won.value||0).toLocaleString():0}</div><div class="label">成交金额</div></div>`;
  const max = Math.max(1, ...bs.map(x=>x.count));
  const order = ['lead','prospect','negotiating','won','lost'];
  document.getElementById('funnel').innerHTML = order.map(s=>{
    const v = countOf(s);
    return `<div class="funnel-row"><span class="tag">${STATUS_MAP[s]}</span><div class="bar" style="width:${Math.round(v/max*100)}%"></div><span class="val">${v}</span></div>`;
  }).join('');
}

/* ---------- 客户 ---------- */
async function loadCustomers(){
  const kw = document.getElementById('search-input').value.trim();
  const d = await api('/api/customers?page=1&page_size=50' + (kw?('&keyword='+encodeURIComponent(kw)):''));
  const list = d.items || d.customers || [];
  const el = document.getElementById('customer-list');
  if (!list.length){ el.innerHTML = '<div class="empty">没有匹配的客户</div>'; return; }
  el.innerHTML = list.map(c=>`
    <div class="customer-item ${currentCustomer===c.id?'active':''}" onclick="loadDetail(${c.id})">
      <div class="top"><span class="name">${esc(c.name)}</span><span class="badge b-${c.status}">${STATUS_MAP[c.status]||c.status}</span></div>
      <div class="company">${esc(c.company||'-')}</div>
      <div class="foot"><span>¥${(c.value||0).toLocaleString()}</span><span>${esc(c.owner||'')}</span></div>
    </div>`).join('');
}

async function createCustomer(){
  const name = document.getElementById('new-name').value.trim();
  if (!name){ alert('请填写姓名'); return; }
  const data = await post('/api/customers', {
    name, company: document.getElementById('new-company').value.trim(),
    value: Number(document.getElementById('new-value').value)||0
  });
  document.getElementById('new-name').value = document.getElementById('new-company').value = document.getElementById('new-value').value = '';
  await refreshAll();
  const cid = data.customer?.id || data.id;
  if (cid) loadDetail(cid);
  if (data.workflow?.length) addBotMsg('⚡ 工作流已触发：' + data.workflow.map(w=>w.rule||w.name||JSON.stringify(w.result||{})).join('；'));
}

async function loadDetail(id){
  currentCustomer = id;
  loadCustomers();
  const c = await api('/api/customers/'+id);
  const fups = (await api(`/api/customers/${id}/follow_ups`)).items || [];
  document.getElementById('detail-title').textContent = c.name;
  document.getElementById('detail-body').innerHTML = `
    <div class="kv">
      <span class="k">公司</span><span>${esc(c.company||'-')}</span>
      <span class="k">电话</span><span>${esc(c.phone||'-')}</span>
      <span class="k">金额</span><span>¥${(c.value||0).toLocaleString()}</span>
      <span class="k">负责人</span><span>${esc(c.owner||'-')}</span>
      <span class="k">阶段</span><span><span class="badge b-${c.status}">${STATUS_MAP[c.status]||c.status}</span></span>
    </div>
    <div class="inline-form">
      <select id="status-sel">
        ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${k===c.status?'selected':''}>${v}</option>`).join('')}
      </select>
      <button class="btn sm" onclick="updateStatus(${c.id})">更新阶段</button>
      <button class="btn ghost sm" onclick="delCustomer(${c.id})">删除</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:12px 0">
    <div style="font-size:12px;font-weight:600;margin-bottom:8px">跟进记录 (${fups.length})</div>
    <div class="inline-form">
      <input id="fup-content" type="text" placeholder="写跟进，如：电话回访确认预算" style="flex:1;min-width:140px">
      <button class="btn sm" onclick="addFollowUp(${c.id})">+ 跟进</button>
    </div>
    <div style="margin-top:10px">
      ${fups.length ? fups.map(f=>`<div class="follow-item">${esc(f.content)}<div class="time">${esc(f.created_at||'')}</div></div>`).join('') : '<div class="empty">暂无跟进</div>'}
    </div>`;
}

async function updateStatus(id){
  const status = document.getElementById('status-sel').value;
  const d = await patch('/api/customers/'+id, {status});
  await refreshAll();
  await loadDetail(id);
  if (d.workflow?.length) addBotMsg('⚡ 阶段变更触发工作流：' + d.workflow.map(w=>JSON.stringify(w.result||{})).join('；'));
}

async function delCustomer(id){
  if (!confirm('确认删除该客户？')) return;
  await api('/api/customers/'+id, {method:'DELETE'});
  currentCustomer = null;
  document.getElementById('detail-body').innerHTML = '<div class="empty">未选择客户</div>';
  document.getElementById('detail-title').textContent = '客户详情';
  await refreshAll();
}

async function addFollowUp(id){
  const content = document.getElementById('fup-content').value.trim();
  if (!content) return;
  const d = await post(`/api/customers/${id}/follow_ups`, {content});
  await loadDetail(id);
  await loadStats();
  if (d.workflow?.length) addBotMsg('⚡ 跟进触发工作流：' + d.workflow.map(w=>JSON.stringify(w.result||{})).join('；'));
}

/* ---------- Agent / RAG ---------- */
function switchTab(m){
  mode = m;
  for (const t of ['agent','rag','aigc'])
    document.getElementById('tab-'+t).className = m===t?'on':'';
  document.getElementById('quick-agent').style.display = m==='agent'?'flex':'none';
  document.getElementById('quick-rag').style.display = m==='rag'?'flex':'none';
  document.getElementById('chat-log').style.display = m==='aigc'?'none':'flex';
  document.getElementById('aigc-panel').style.display = m==='aigc'?'block':'none';
  document.getElementById('chat-foot').style.display = m==='aigc'?'none':'block';
  if (m==='aigc') loadAigcStatus();
}

/* ---------- AIGC 文生图 ---------- */
async function loadAigcStatus(){
  const el = document.getElementById('aigc-status');
  try{
    const d = await api('/api/aigc/status');
    el.innerHTML = d.connected
      ? `🟢 ComfyUI 已连接（${esc(d.comfyui_url)}），模型：${esc(d.checkpoint)}`
      : `🔴 ComfyUI 未连接（${esc(d.comfyui_url)}）——请先启动本机 ComfyUI`;
  }catch(e){ el.textContent = '状态查询失败：' + e.message; }
}

async function generateImage(){
  const prompt = document.getElementById('aigc-prompt').value.trim();
  if (!prompt){ alert('请填写提示词'); return; }
  const [w, h] = document.getElementById('aigc-size').value.split('x').map(Number);
  const btn = document.getElementById('aigc-btn');
  const box = document.getElementById('aigc-results');
  btn.disabled = true; btn.textContent = '生成中(约数十秒)...';
  box.insertAdjacentHTML('afterbegin', '<div class="loading" id="aigc-pending">已提交 ComfyUI，排队生成中...</div>');
  try{
    const d = await post('/api/aigc/text2image', {
      prompt, negative: document.getElementById('aigc-negative').value.trim(),
      width: w, height: h,
    });
    document.getElementById('aigc-pending').remove();
    box.insertAdjacentHTML('afterbegin',
      d.files.map(u=>`<a href="${u}" target="_blank"><img src="${u}" style="width:100%;border-radius:8px;margin-bottom:8px"></a>`).join(''));
  }catch(e){
    document.getElementById('aigc-pending').remove();
    box.insertAdjacentHTML('afterbegin', `<div style="color:var(--danger);font-size:12px;margin-bottom:8px">生成失败：${esc(e.message)}</div>`);
  }finally{
    btn.disabled = false; btn.textContent = '生成图片';
  }
}
function quickAsk(btn){ document.getElementById('chat-input').value = btn.textContent; sendChat(); }
function quickAskRag(btn){ document.getElementById('chat-input').value = btn.textContent; sendChat(); }

function addUserMsg(t){
  const log = document.getElementById('chat-log');
  log.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(t)}</div>`);
  log.scrollTop = log.scrollHeight;
}
function addBotMsg(t, extra=''){
  const log = document.getElementById('chat-log');
  log.insertAdjacentHTML('beforeend', `<div class="msg bot">${esc(t)}${extra}</div>`);
  log.scrollTop = log.scrollHeight === undefined ? 0 : log.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  const log = document.getElementById('chat-log');
  log.insertAdjacentHTML('beforeend', '<div class="loading" id="pending">思考中...</div>');
  log.scrollTop = log.scrollHeight;
  try{
    if (mode === 'agent'){
      const d = await post('/api/agent/chat', {message: text});
      document.getElementById('pending').remove();
      const steps = (d.steps||[]).length ? `<div class="steps">${d.steps.map(s=>`<div class="step">⚙ ${esc(s.tool)}(${esc(JSON.stringify(s.arguments))}) → ${esc(s.status)}</div>`).join('')}</div>` : '';
      addBotMsg(d.answer || '(无回复)', steps);
      refreshAll();
    } else {
      const d = await post('/api/rag/query', {question: text});
      document.getElementById('pending').remove();
      const srcs = (d.sources||[]).length ? `<div class="srcs">${d.sources.map(s=>`<span class="src">📄 ${esc(typeof s==='string'?s:(s.title||s.doc_title||'文档'))}</span>`).join('')}</div>` : '';
      addBotMsg(d.answer || '未命中知识库', srcs);
    }
  }catch(e){
    document.getElementById('pending').remove();
    addBotMsg('出错了：' + e.message);
  }
}

async function refreshAll(){ await Promise.all([loadHealth(), loadStats(), loadCustomers()]); }
refreshAll().catch(e=>{ document.getElementById('health-meta').innerHTML = '<span style="background:#e34d59">服务未连接</span>'; });
setInterval(loadHealth, 15000);
</script>
