name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Start server (offline demo mode)
        run: |
          python main.py &
          sleep 6

      - name: Smoke tests (full pipeline - CRUD/RAG/Agent/Workflow)
        run: python tests/smoke_test.py

      - name: Edge tests (error paths, concurrency, agent self-healing)
        run: python tests/edge_test.py
